<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>MohToh — You're offline</title>
<style>
  :root { --color-primary: #0F8B8D; --color-primary-700: #0a5a5b; --color-accent: #FFC107; }
  * { box-sizing: border-box; }
  body {
    margin: 0; min-height: 100vh; display: flex; align-items: center; justify-content: center;
    font-family: 'Inter', -apple-system, BlinkMacSystemFont, sans-serif;
    background: linear-gradient(165deg, var(--color-primary) 0%, var(--color-primary-700) 100%);
    color: #fff; text-align: center; padding: 24px;
  }
  .offline-card { max-width: 340px; }
  .offline-icon {
    width: 72px; height: 72px; border-radius: 20px; background: var(--color-accent);
    display: flex; align-items: center; justify-content: center; margin: 0 auto 20px;
    font-size: 32px; color: var(--color-primary-700);
  }
  h1 { font-size: 1.3rem; margin: 0 0 8px; }
  p { color: rgba(255,255,255,0.85); margin: 0 0 24px; line-height: 1.5; }
  button {
    background: var(--color-accent); color: var(--color-primary-700); border: none;
    padding: 12px 28px; border-radius: 999px; font-weight: 700; font-size: 0.95rem; cursor: pointer;
  }
</style>
</head>
<body>
  <div class="offline-card">
    <div class="offline-icon">&#8226;</div>
    <h1>You're offline</h1>
    <p>MohToh needs an internet connection to load trips, wallet, and live ride data. Reconnect and try again.</p>
    <button type="button" onclick="location.reload()">Retry</button>
  </div>
</body>
</html>
